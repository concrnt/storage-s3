name: Check

on:
  push:
    branches: [ 'main' ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
